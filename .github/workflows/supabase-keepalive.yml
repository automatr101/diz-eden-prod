name: Supabase Keep-Alive

# Supabase's free tier auto-pauses a project after ~7 days with no API activity.
# This site's Supabase project has been pausing unexpectedly, breaking live
# bookings/payments until someone notices. This workflow runs a trivial,
# read-only query every 3 days to keep the project active. This is a stopgap
# for the free tier, not a substitute for upgrading to a paid plan if uptime
# guarantees matter (Pro tier removes auto-pause entirely).

on:
  schedule:
    # Every 3 days at 06:00 UTC — well under the ~7 day pause threshold.
    - cron: "0 6 */3 * *"
  workflow_dispatch: {} # allows manually triggering a run from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/settings?select=key&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Supabase responded with HTTP $status"
          if [ "$status" -ge 400 ]; then
            echo "::error::Supabase keep-alive ping failed with status $status"
            exit 1
          fi
